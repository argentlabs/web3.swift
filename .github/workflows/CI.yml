name: CI

on:
  pull_request:
    branches: [ develop ]
  # Pull requests from forks run without secrets, so the tests that spend Ether skip there. Running
  # again on the merge commit is what actually exercises them.
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_lint:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Lint
      run: ./scripts/runSwiftFormat.sh -l

  test_macos:
    needs: run_lint

    runs-on: macos-latest

    env:
      # Empty for pull requests from forks, which GitHub never gives secrets to. The tests that
      # spend Ether skip themselves when it is absent; everything else runs.
      TESTS_PRIVATEKEY: ${{ secrets.TESTS_PRIVATEKEY }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Build
      run: swift build

    - name: Tests
      run: swift test

  test_linux:
    # Only gated on lint. Previously this also needed test_macos, so a red macOS run meant
    # Linux never executed at all and the platform went untested.
    needs: run_lint

    runs-on: ubuntu-latest

    container:
      image: swift:6.3-jammy

    env:
      # Empty for pull requests from forks, which GitHub never gives secrets to. The tests that
      # spend Ether skip themselves when it is absent; everything else runs.
      TESTS_PRIVATEKEY: ${{ secrets.TESTS_PRIVATEKEY }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Build
      run: swift build

    - name: Tests
      run: swift test
