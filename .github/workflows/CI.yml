name: CI

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_lint:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Lint
      run: ./scripts/runSwiftFormat.sh -l

  test_macos:
    needs: run_lint

    runs-on: macos-latest

    env:
      TESTS_PRIVATEKEY: ${{ secrets.TESTS_PRIVATEKEY }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: SetupKey
      run: ./scripts/setupKey.sh "${{ secrets.TESTS_PRIVATEKEY }}"

    - name: Build
      run: swift build

    - name: Tests
      run: swift test

  test_linux:
    # Only gated on lint. Previously this also needed test_macos, so a red macOS run meant
    # Linux never executed at all and the platform went untested.
    needs: run_lint

    runs-on: ubuntu-latest

    container:
      # Package.resolved is format v3, which Swift 5.9 cannot parse. This job had not run in
      # about a year — it was gated behind test_macos, which was permanently red — so the
      # mismatch went unnoticed.
      image: swift:6.1-jammy

    env:
      TESTS_PRIVATEKEY: ${{ secrets.TESTS_PRIVATEKEY }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: SetupKey
      run: ./scripts/setupKey.sh "${{ secrets.TESTS_PRIVATEKEY }}"

    - name: Build
      run: swift build

    - name: Tests
      run: swift test
